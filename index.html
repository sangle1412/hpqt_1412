<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chúc sức khoẻ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes fall {
      0% {
        transform: translateY(0px) rotate(0deg) translateX(0px);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      85% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(115vh) rotate(360deg) translateX(-15px);
        opacity: 0;
      }
    }
    .petal {
      position: absolute;
      top: -80px;
      opacity: 0;
      pointer-events: none;
      animation: fall linear infinite;
      user-select: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-800 antialiased font-sans select-none h-[100dvh] w-full flex items-center justify-center overflow-hidden">

  <!-- FRAME MOBILE SIMULATOR -->
  <div class="w-full max-w-[430px] h-[100dvh] sm:h-[844px] bg-slate-900 flex flex-col justify-center items-center relative overflow-hidden shadow-2xl sm:rounded-[40px]">
    
    <!-- ẨN HOÀN TOÀN THẺ AUDIO TRONG BACKGROUND -->
    <audio id="bg-audio" src="goodbye_bg.mp3" loop preload="auto"></audio>

    <!-- HIỆU ỨNG HOA RƠI CONTAINER -->
    <div id="petal-container" class="absolute inset-0 pointer-events-none z-20 overflow-hidden"></div>

    <!-- MÀN HÌNH BANNER CỐ ĐỊNH FULL SCREEN -->
    <div class="relative w-full h-full flex flex-col items-center justify-center p-3 bg-slate-950 overflow-hidden">
      
      <!-- Khung ảnh goodbye.png (Full Width) -->
      <div class="w-full relative rounded-2xl overflow-hidden shadow-2xl border border-slate-800/80">
        <img id="img-goodbye" src="goodbye.png" alt="再见" class="w-full h-auto object-cover opacity-95 block" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'600\' height=\'350\' viewBox=\'0 0 600 350\'><rect width=\'600\' height=\'350\' fill=\'%230f172a\'/><text x=\'300\' y=\'210\' font-family=\'sans-serif\' font-weight=\'bold\' font-size=\'100\' fill=\'%23ffffff\' text-anchor=\'middle\'>再见</text></svg>'">
      </div>

    </div>

  </div>

  <script>
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }

    // Tạo hiệu ứng hoa rơi tự nhiên
    function initPetals() {
      const container = document.getElementById('petal-container');
      if (!container) return;
      const petalTypes = ['🌸', '🌸', '🏵️', '🌸', '✨'];
      const count = 22;

      for (let i = 0; i < count; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.innerText = petalTypes[Math.floor(Math.random() * petalTypes.length)];
        petal.style.left = Math.random() * 100 + '%';
        petal.style.fontSize = (Math.random() * 10 + 14) + 'px';
        petal.style.animationDuration = (Math.random() * 6 + 5) + 's';
        petal.style.animationDelay = (Math.random() * 7) + 's';
        container.appendChild(petal);
      }
    }
    initPetals();

    const bgAudio = document.getElementById('bg-audio');

    // Hàm tự động kích hoạt phát nhạc chìm
    function playAudioNaturally() {
      if (bgAudio && bgAudio.paused) {
        bgAudio.play().then(() => {
          removeAudioListeners();
        }).catch(err => {
          console.log("Waiting for first user touch...");
        });
      }
    }

    function removeAudioListeners() {
      document.removeEventListener('click', playAudioNaturally);
      document.removeEventListener('touchstart', playAudioNaturally);
      document.removeEventListener('pointerdown', playAudioNaturally);
    }

    // Thử phát ngay khi vừa load (trình duyệt sẽ cấp quyền nếu đã từng tương tác domain)
    window.addEventListener('DOMContentLoaded', playAudioNaturally);
    window.addEventListener('load', playAudioNaturally);

    // Kích hoạt ngay ở bất kỳ cú chạm/nhấp chuột nào
    document.addEventListener('click', playAudioNaturally, { once: false });
    document.addEventListener('touchstart', playAudioNaturally, { once: false });
    document.addEventListener('pointerdown', playAudioNaturally, { once: false });
  </script>
</body>
</html>
